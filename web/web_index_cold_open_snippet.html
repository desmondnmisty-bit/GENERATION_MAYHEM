<!-- GM COLD OPEN 1030 (bake-only): paste right after <body>. Video has captions + title sting baked in. -->
<div id="gmColdOpen" style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer">
  <video id="gmColdOpenVid" src="intro/gm_cold_open.mp4" muted autoplay playsinline preload="auto" style="max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain"></video>
  <div style="position:absolute;right:24px;bottom:20px;color:#ff1f99;font:bold 16px monospace;opacity:.8">CLICK / ANY KEY TO SKIP &gt;&gt;</div>
</div>
<script>
(function(){
  var o=document.getElementById('gmColdOpen'),v=document.getElementById('gmColdOpenVid'),gone=false;
  function done(){ if(gone)return; gone=true; try{v.pause();}catch(e){} o.remove(); window.removeEventListener('keydown',done,true); }
  o.addEventListener('click',done); window.addEventListener('keydown',done,true);
  v.addEventListener('ended',done); v.addEventListener('error',done);
  var p=v.play(); if(p&&p.catch)p.catch(function(){}); // muted autoplay; overlay stays clickable if blocked
})();
</script>
<!-- /GM COLD OPEN 1030 -->
